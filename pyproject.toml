[project]
name = "spec-writing-kit-cli"
version = "0.0.22"
description = "Spec Writing Kit CLI. A tool to bootstrap your projects for Spec-Driven Writing."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
]

[project.scripts]
writekit = "writekit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writekit_cli"]
